<script>
  // Night mode button: switches light/dark, remembered in this browser. Kept outside
  // the main script so it works even when the page has no data.
  (function () {
    const KEY = "job-offers-theme";
    const btn = document.getElementById("theme-toggle");
    const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    const isDark = () => {
      const t = document.documentElement.getAttribute("data-theme");
      return t ? t === "dark" : !!(media && media.matches);
    };
    const paint = () => {
      btn.textContent = isDark() ? "☀️" : "🌙";
      btn.title = isDark() ? "Switch to day mode" : "Switch to night mode";
    };
    btn.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(KEY, next); } catch (e) { /* storage unavailable */ }
      paint();
    });
    if (media && media.addEventListener) media.addEventListener("change", paint);
    paint();
  })();
</script>

<script>
(function () {
  "use strict";
  let DATA;
  try {
    DATA = JSON.parse(document.getElementById("data").textContent);
  } catch (e) {
    // Opened the template itself (data token not filled in) or the data is corrupt
    document.getElementById("count").textContent =
      "No data: this file is the template. Run “python3 job_search.py” (or --html-only) and open reports/offers.html.";
    return;
  }
  const NONE = "—";
  const STORE = "job-offers-sort";

  // Facets: field shown in the sidebar. "job" filters on every matched title.
  const FACETS = [
    // Status first: tick "not interested" here to see the offers hidden by default
    { key: "status", label: "Status", always: true },
    { key: "_prio", label: "Priority" },
    { key: "_level", label: "Level" },
    { key: "contract", label: "Contract" },
    { key: "job", label: "Job title" },
    { key: "city", label: "City", search: true },
    { key: "country", label: "Country" },
    { key: "remote", label: "Remote work" },
    { key: "site", label: "Site" },
    { key: "source", label: "Source" },
    { key: "company", label: "Company", search: true },
    // Which Google search found the offer (empty for HelloWork direct pages / older offers)
    { key: "query", label: "Found by search", search: true },
  ];
  const COLUMNS = [
    { key: "found", label: "Found" },
    { key: "posted", label: "Published" },
    { key: "contract", label: "Contract" },
    { key: "job", label: "Job title" },
    { key: "title", label: "Offer" },
    { key: "company", label: "Company" },
    { key: "city", label: "City" },
    { key: "remote", label: "Remote" },
    { key: "salary", label: "Salary" },
    { key: "site", label: "Site" },
    { key: "status", label: "Status" },
    { key: "_actions", label: "Actions", nosort: true },
  ];

  // Statuses set by the buttons (same strings as STATUS_* in job_search.py). Saving needs
  // the page to be served by "python3 job_search.py --serve"; opened as a file, it's read-only.
  const APPLIED = "applied", NOT_INTERESTED = "not interested";
  const SERVER = DATA.server;   // {token} when served, null when opened from disk

  // Data values (contract, remote, source, ...) are shown exactly as job_search.py stores
  // them in offers.csv, in French; only the interface itself is in English.
  // The two button statuses are stored lowercase but shown capitalised.
  const STATUS_LABEL = { [APPLIED]: "Applied", [NOT_INTERESTED]: "Not interested" };
  function display(key, v) {
    if (key === "status" && STATUS_LABEL[v]) return STATUS_LABEL[v];
    return v || NONE;
  }

  // Same normalisation as job_search.py norm(): accents, case and punctuation ignored
  const normCity = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const PRIORITY = new Set((DATA.priority_cities || []).map(normCity));
  const PRIO_YES = "★ Priority city", PRIO_NO = "Other cities";
  const JUNIOR = (DATA.junior_words || []).map(normCity);
  const LEVEL_JUNIOR = "Junior", LEVEL_OTHER = "Not specified";
  const ISO = /^\d{4}-\d{2}-\d{2}$/;

  const offers = DATA.offers.map(o => {
    // "," normally; ";" too in case a spreadsheet rewrote the separator
    const jobs = (o.matched || o.job || "").split(/[,;]/).map(s => s.trim()).filter(Boolean);
    const text = [o.title, o.company, o.city, o.country, o.site, o.source, o.matched, o.notes, o.status]
      .join(" ").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const prio = PRIORITY.has(normCity(o.city));
    // Junior = a junior_title_words word in the title (whole word, accents/case ignored)
    const t = " " + normCity(o.title) + " ";
    const junior = JUNIOR.some(w => w && t.includes(" " + w + " "));
    return Object.assign({}, o, {
      _jobs: jobs.length ? jobs : [NONE], _text: text, _isPrio: prio, _prio: prio ? PRIO_YES : PRIO_NO,
      _isJunior: junior, _level: junior ? LEVEL_JUNIOR : LEVEL_OTHER,
      // posted is ISO when job_search.py could parse Google's/HelloWork's date, else raw text or empty
      _postedIso: ISO.test(o.posted || "") ? o.posted : "",
    });
  });

  // Facet values for one offer (arrays so "job" can hold several)
  function values(o, key) {
    if (key === "job") return o._jobs;
    return [o[key] || NONE];
  }

  // Preferred ordering of facet values, then by count
  const ORDER = {
    contract: DATA.contracts, job: DATA.titles, _prio: [PRIO_YES, PRIO_NO], status: [APPLIED, NOT_INTERESTED],
    _level: [LEVEL_JUNIOR, LEVEL_OTHER],
  };

  // Every visit starts unfiltered (all offers shown). Only the column sort is
  // remembered between visits; filters last for the current visit only.
  let state = { q: "", found: "", posted: "", sel: {}, sort: { key: "found", dir: -1 }, facetQ: {} };
  try {
    localStorage.removeItem("job-offers-filters");  // older versions saved the filters too
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && saved.sort && COLUMNS.some(c => c.key === saved.sort.key && !c.nosort)) state.sort = saved.sort;
  } catch (e) { /* storage unavailable: start with defaults */ }
  FACETS.forEach(f => { state.sel[f.key] = new Set(); });

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ sort: state.sort }));
    } catch (e) { /* ignore */ }
  }

  function daysAgo(iso) {
    const d = new Date(iso + "T00:00:00"), t = new Date(DATA.today + "T00:00:00");
    return Math.round((t - d) / 86400000);
  }

  // Does an offer pass every filter, optionally ignoring one facet (for counts)?
  function passes(o, skipFacet) {
    // "Not interested" offers stay hidden unless you tick "not interested" in the
    // Status filter. Not applied while counting the Status filter itself, so its
    // "not interested" option shows the real count.
    if (o.status === NOT_INTERESTED && skipFacet !== "status" && !state.sel.status.has(NOT_INTERESTED)) return false;
    if (state.q) {
      const words = state.q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/\s+/).filter(Boolean);
      if (!words.every(w => o._text.includes(w))) return false;
    }
    if (state.found !== "" && !(o.found && daysAgo(o.found) <= Number(state.found))) return false;
    if (state.posted === "unknown") {
      if (o._postedIso) return false;
    } else if (state.posted !== "") {
      if (!o._postedIso || daysAgo(o._postedIso) > Number(state.posted)) return false;
    }
    for (const f of FACETS) {
      if (f.key === skipFacet) continue;
      const sel = state.sel[f.key];
      if (sel.size && !values(o, f.key).some(v => sel.has(v))) return false;
    }
    return true;
  }

  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    (children || []).forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }

  function renderFacets() {
    const root = document.getElementById("facets");
    root.replaceChildren();
    for (const f of FACETS) {
      // Counts reflect all other active filters, so you see what selecting a value would give
      const counts = new Map();
      const all = new Set();
      offers.forEach(o => values(o, f.key).forEach(v => all.add(v)));
      // Status always lists the two button statuses, even before any offer has them
      if (f.key === "status") { all.add(APPLIED); all.add(NOT_INTERESTED); all.add(NONE); }
      offers.filter(o => passes(o, f.key)).forEach(o => values(o, f.key).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
      if (!f.always && all.size <= 1 && !state.sel[f.key].size) continue;  // nothing to choose from

      const order = ORDER[f.key] || [];
      let vals = [...all].sort((a, b) => {
        const ia = order.indexOf(a), ib = order.indexOf(b);
        if (ia !== -1 || ib !== -1) return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
        if (a === NONE) return 1;
        if (b === NONE) return -1;
        return (counts.get(b) || 0) - (counts.get(a) || 0) || a.localeCompare(b, "fr");
      });
      const fq = (state.facetQ[f.key] || "").toLowerCase();
      if (fq) vals = vals.filter(v => display(f.key, v).toLowerCase().includes(fq));

      const list = el("div", { class: "facet" }, vals.map(v => {
        const n = counts.get(v) || 0;
        const cb = el("input", { type: "checkbox" });
        cb.checked = state.sel[f.key].has(v);
        cb.addEventListener("change", () => {
          cb.checked ? state.sel[f.key].add(v) : state.sel[f.key].delete(v);
          render();
        });
        const label = display(f.key, v);
        return el("label", { class: n ? "" : "zero" }, [
          cb, el("span", { class: "name", text: label, title: label }), el("span", { class: "count", text: String(n) }),
        ]);
      }));

      const clear = state.sel[f.key].size
        ? el("button", { text: "clear", onclick: () => { state.sel[f.key].clear(); render(); } })
        : null;
      const search = f.search
        ? el("input", { type: "search", class: "facet-search", placeholder: "Filter…", value: state.facetQ[f.key] || "" })
        : null;
      if (search) {
        search.addEventListener("input", () => {
          state.facetQ[f.key] = search.value;
          renderFacets();
          const again = document.querySelector(`[data-facet="${f.key}"] .facet-search`);
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        });
      }
      root.appendChild(el("div", { class: "box", "data-facet": f.key }, [
        el("h3", {}, [f.label, clear]), search, list,
      ]));
    }
  }

  function renderChips() {
    const root = document.getElementById("chips");
    root.replaceChildren();
    const selects = [
      ["posted", "Published", document.getElementById("posted")],
      ["found", "Found", document.getElementById("found")],
    ];
    for (const [key, label, select] of selects) {
      if (state[key] === "") continue;
      const text = select.options[select.selectedIndex] ? select.options[select.selectedIndex].text : state[key];
      root.appendChild(el("button", {
        class: "chip", text: `${label}: ${text} ✕`,
        onclick: () => { state[key] = ""; select.value = ""; render(); },
      }));
    }
    for (const f of FACETS) {
      for (const v of state.sel[f.key]) {
        root.appendChild(el("button", {
          class: "chip", text: `${f.label}: ${display(f.key, v)} ✕`,
          onclick: () => { state.sel[f.key].delete(v); render(); },
        }));
      }
    }
  }

  function badge(contract) {
    const known = ["Alternance", "Stage", "CDI"].includes(contract);
    return el("span", { class: "badge " + (known ? "b-" + contract : "b-other"), text: display("contract", contract) });
  }

  function renderHead() {
    const head = document.getElementById("head");
    head.replaceChildren(...COLUMNS.map(c => {
      if (c.nosort) return el("th", { text: c.label, style: "cursor: default" });
      const arrow = state.sort.key === c.key ? (state.sort.dir > 0 ? " ▲" : " ▼") : "";
      return el("th", {
        class: state.sort.key === c.key ? "sorted" : "", text: c.label + arrow,
        onclick: () => {
          state.sort = state.sort.key === c.key ? { key: c.key, dir: -state.sort.dir } : { key: c.key, dir: c.key === "found" || c.key === "posted" ? -1 : 1 };
          render();
        },
      });
    }));
  }

  function renderRows(list) {
    const { key, dir } = state.sort;
    // Sort published dates on the parsed ISO value; unparsed text sorts as empty (last)
    const sortVal = (o) => key === "posted" ? o._postedIso : (o[key] || "");
    list.sort((a, b) => {
      // Junior offers always on top, then priority-city offers, then the chosen column
      if (a._isJunior !== b._isJunior) return a._isJunior ? -1 : 1;
      if (a._isPrio !== b._isPrio) return a._isPrio ? -1 : 1;
      const va = sortVal(a), vb = sortVal(b);
      if (!va && vb) return 1;   // empty values always last
      if (va && !vb) return -1;
      return dir * va.localeCompare(vb, "fr") || (b.found || "").localeCompare(a.found || "");
    });
    const body = document.getElementById("rows");
    body.replaceChildren(...list.map(o => {
      const link = /^https?:\/\//.test(o.url || "")
        ? el("a", { href: o.url, target: "_blank", rel: "noopener noreferrer", text: o.title || o.url })
        : el("span", { text: o.title || NONE });
      const isNew = o.found === DATA.today ? el("span", { class: "new", text: "NEW" }) : null;
      const sub = o.notes ? el("div", { class: "sub", text: o.notes }) : null;
      const cell = (v, cls) => el("td", { class: cls || "", text: v || NONE });
      return el("tr", { class: o.status === NOT_INTERESTED ? "hidden-offer" : "" }, [
        el("td", { class: "nowrap" }, [o.found || NONE, isNew]),
        cell(o.posted, "nowrap muted"),
        el("td", {}, [badge(o.contract)]),
        cell(o.job),
        el("td", { class: "title" }, [o._isJunior ? el("span", { class: "junior", text: "Junior" }) : null, link, sub]),
        cell(o.company),
        cell((o._isPrio ? "★ " : "") + (o.city || NONE), o._isPrio ? "prio" : ""),
        cell(display("remote", o.remote), "muted"),
        cell(o.salary, "nowrap"),
        cell(o.site, "muted"),
        statusCell(o),
        actionsCell(o),
      ]);
    }));
    document.getElementById("empty").hidden = list.length > 0;
  }

  function statusCell(o) {
    if (o.status === APPLIED) {
      return el("td", { class: "st-applied", text: "✓ Applied" + (o.applied_on ? ` ${o.applied_on}` : "") });
    }
    if (o.status === NOT_INTERESTED) return el("td", { class: "st-hidden", text: "Not interested" });
    return el("td", { text: o.status || NONE });   // any status typed by hand in the CSV
  }

  function actionsCell(o) {
    const tip = SERVER ? "" : "Read-only: start “python3 job_search.py --serve” to save changes";
    const btn = (text, cls, title, status) => {
      const b = el("button", { text, class: cls, title: tip || title });
      b.disabled = !SERVER;
      b.addEventListener("click", () => setStatus(o, status, b));
      return b;
    };
    const kids = [];
    if (o.status !== APPLIED) kids.push(btn("✓ Applied", "", "Mark as applied (saves today's date)", APPLIED));
    if (o.status !== NOT_INTERESTED) kids.push(btn("✕ Not interested", "", "Hide this offer", NOT_INTERESTED));
    if (o.status === APPLIED || o.status === NOT_INTERESTED) {
      kids.push(btn("↺", o.status === APPLIED ? "on-applied" : "on-hidden", "Undo: clear the status", ""));
    }
    return el("td", { class: "actions" }, kids);
  }

  // kind: true / "error" = red, "running" = blue, "done" = green, otherwise neutral
  function showBanner(text, kind) {
    const b = document.getElementById("banner");
    const cls = kind === true ? "error" : (kind || "");
    b.className = "banner" + (cls ? " " + cls : "");
    b.textContent = text;
    b.hidden = !text;
  }

  // ---- Search buttons: start a run on the local server and follow its progress ----
  const PLAN = SERVER && SERVER.plan;
  const runFree = document.getElementById("run-free");
  const runFull = document.getElementById("run-full");
  const runSite = document.getElementById("run-site");
  const runSiteBtn = document.getElementById("run-site-btn");
  const runButtons = [runFree, runFull, runSite, runSiteBtn];

  function setupRunControls() {
    if (!PLAN) {
      const tip = "Start “python3 job_search.py --serve” to search from this page";
      runButtons.forEach(b => { b.disabled = true; b.title = tip; });
      runFull.textContent = "🔍 Full search";
      return;
    }
    runFree.textContent = `🔍 Free search (0 credits, ${PLAN.offline_pages} HelloWork pages)`;
    runFull.textContent = `🔍 Full search (${PLAN.full} credits)`;
    runSite.replaceChildren(...PLAN.sites.map(s => {
      const opt = document.createElement("option");
      opt.value = s.name;
      opt.textContent = `${s.name} (${s.credits} credits)`;
      return opt;
    }));
    if (!PLAN.has_key) {
      const tip = "No api_key in jobs_config.toml: only the free search is available";
      [runFull, runSite, runSiteBtn].forEach(b => { b.disabled = true; b.title = tip; });
    }
    runFree.addEventListener("click", () => startRun("offline", "", 0));
    runFull.addEventListener("click", () => startRun("full", "", PLAN.full));
    runSiteBtn.addEventListener("click", () => {
      const site = PLAN.sites.find(s => s.name === runSite.value);
      if (site) startRun("site", site.name, site.credits);
    });
  }

  function setRunning(running) {
    if (!PLAN) return;
    runFree.disabled = running;
    [runFull, runSite, runSiteBtn].forEach(b => { b.disabled = running || !PLAN.has_key; });
  }

  async function api(method, path, body) {
    const resp = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", "X-Token": SERVER.token },
      body: body ? JSON.stringify(body) : undefined,
    });
    const res = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(res.error || `HTTP ${resp.status}`);
    return res;
  }

  async function startRun(mode, site, credits) {
    const what = mode === "offline" ? "a free search (HelloWork pages only)"
      : mode === "full" ? "a full search" : `a search on ${site}`;
    if (credits > 0 && !window.confirm(`Start ${what}?\n\nThis uses ${credits} Serper credits.`)) return;
    setRunning(true);
    try {
      const res = await api("POST", "/api/run", { mode, site, expected_credits: credits });
      showBanner(`⏳ ${res.label} started (${res.credits} credits)…`, "running");
      pollRun(false);
    } catch (e) {
      showBanner(`Search not started: ${e.message}`, true);
      setRunning(false);
    }
  }

  // fromLoad: called once when the page opens, to pick up a search that is still
  // running (e.g. after a manual reload). It never reloads for an already-finished run.
  async function pollRun(fromLoad) {
    let st;
    try {
      st = await api("GET", "/api/run");
    } catch (e) {
      showBanner(`Lost contact with the server: ${e.message}. Is “python3 job_search.py --serve” still running?`, true);
      setRunning(false);
      return;
    }
    if (st.running) {
      setRunning(true);
      showBanner(`⏳ ${st.label} (started ${st.started}) — ${st.message}`, "running");
      setTimeout(() => pollRun(false), 1500);
      return;
    }
    setRunning(false);
    const r = st.result;
    if (!r || fromLoad) return;   // nothing running: leave the page as it is
    if (r.ok) {
      showBanner(`✓ ${st.label} finished at ${st.finished}: ${r.new} new offer(s), ${r.total} tracked, ` +
        `${r.credits} credits used. Reloading…`, "done");
      setTimeout(() => location.reload(), 1500);
    } else {
      showBanner(`✕ ${st.label} failed: ${r.error || "see the terminal"}`, true);
    }
  }

  // Save a status through the local server; the page only changes once offers.csv is saved
  async function setStatus(o, status, button) {
    if (!SERVER) return;
    button.disabled = true;
    try {
      const resp = await fetch("/api/status", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Token": SERVER.token },
        body: JSON.stringify({ url: o.url, status }),
      });
      const res = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(res.error || `HTTP ${resp.status}`);
      o.status = res.status;
      o.applied_on = res.applied_on;
      showBanner("", false);
      render();
    } catch (e) {
      showBanner(`Not saved: ${e.message}. ` +
        "Is “python3 job_search.py --serve” still running? Reload the page after restarting it.", true);
      button.disabled = false;
    }
  }

  function render() {
    const list = offers.filter(o => passes(o));
    const fresh = offers.filter(o => o.found === DATA.today).length;
    const applied = offers.filter(o => o.status === APPLIED).length;
    const hidden = offers.filter(o => o.status === NOT_INTERESTED).length;
    document.getElementById("count").textContent = `${list.length} / ${offers.length} offers`;
    document.getElementById("meta").textContent =
      `${offers.length} offers tracked · ${offers.filter(o => o._isPrio).length} ★ in priority cities · ` +
      `${applied} applied · ${hidden} not interested (hidden) · ${fresh} new today · generated ${DATA.generated}`;
    renderFacets();
    renderChips();
    renderHead();
    renderRows(list);
    save();
  }

  const q = document.getElementById("q");
  const found = document.getElementById("found");
  const posted = document.getElementById("posted");
  q.value = state.q;
  found.value = state.found;
  posted.value = state.posted;
  q.addEventListener("input", () => { state.q = q.value.trim(); render(); });
  found.addEventListener("change", () => { state.found = found.value; render(); });
  posted.addEventListener("change", () => { state.posted = posted.value; render(); });
  document.getElementById("reset").addEventListener("click", () => {
    state.q = ""; state.found = ""; state.posted = "";
    q.value = ""; found.value = ""; posted.value = "";
    FACETS.forEach(f => state.sel[f.key].clear());
    state.facetQ = {};
    render();
  });

  if (!SERVER) {
    showBanner("Read-only view. To mark offers as Applied / Not interested or search from this page, run " +
      "“python3 job_search.py --serve” (Windows: “py job_search.py --serve”) and use the page it opens.", false);
  }
  setupRunControls();
  render();
  if (SERVER) pollRun(true);   // resume following a search that is still running
})();
</script>
</body>
</html>
